[project]
name = "novus-pipeline"
version = "0.1.0"
description = "Novus acquisition and verification pipeline: polite fetching, Snapshots, change detection, evidence checks and the LLM gateway."
readme = "README.md"
requires-python = ">=3.12.4"  # earlier releases misclassify ipaddress.is_global (CVE-2024-4032)
license = { text = "Proprietary" }
dependencies = [
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "pydantic>=2.14,<3",
  "lxml>=6.1,<7",
  "python-dateutil>=2.9",
  "google-genai>=3.1,<4",
  "pypdf>=7",
  "pdfplumber>=0.11",
  "beautifulsoup4>=4.13",
  # Host policy reads shared/policy/hosts.yaml; tldextract uses its bundled PSL snapshot only.
  "pyyaml==6.0.3",
  "tldextract==5.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=9", "respx>=0.23"]
# Modal is imported lazily by modal_app.py; tests never need it.
modal = ["modal>=1.6"]

[project.scripts]
novus-pipeline = "novus_pipeline.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["novus_pipeline*", "novus_llm*", "docintel*", "novus_eligibility*"] } }

[tool.setuptools.package-data]
novus_llm = ["prompts/*.md"]
novus_eligibility = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "novus_pipeline/embeddings"]
pythonpath = ["."]
addopts = "-q"
